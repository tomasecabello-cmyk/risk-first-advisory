# ─────────────────────────────────────────────────────────────────────────────
# Risk profile base parameters — DEMO ASSUMPTIONS, NOT productive CMA.
#
# Estos valores eran hardcoded en
# `src/risk_first_advisory/rules_layer/risk_budget_builder.PROFILE_BASE_PARAMS`.
# Se externalizan para que una firma piloto pueda versionarlos / revisarlos
# en code review sin tocar Python.
#
# IMPORTANTE:
#   - Estos valores son supuestos demo. NO reemplazan un proceso de CMA
#     (Capital Market Assumptions) formal ni la decisión de un comité de
#     inversiones.
#   - El loader (`config_layer/risk_assumptions.py`) requiere los 5 perfiles
#     exactos y los 11 campos por perfil enumerados abajo. Faltantes, campos
#     desconocidos o tipos inválidos → ValueError al iniciar el módulo.
#   - `min_liquidity` y `preferred_currency` se aceptan en el YAML por
#     completitud, pero en el flujo actual de RiskBudgetBuilder son
#     OVERRIDEADOS por `kyc.liquidity_need_pct` y `kyc.preferred_currency`
#     respectivamente. Los valores aquí son "fallback / contrato" de cara
#     a futuras revisiones donde el perfil pueda imponer un piso.
#
# Sincronizado al 100% con los valores anteriores hardcoded — cero cambios
# numéricos al hacer este corte. Cualquier ajuste posterior queda registrado
# en git history sobre este archivo.
# ─────────────────────────────────────────────────────────────────────────────

