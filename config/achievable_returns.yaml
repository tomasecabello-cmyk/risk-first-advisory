#   - El retorno está expresado como decimal anual: 0.07 = 7.0%/año.
#   - El campo `disclaimer` documenta la naturaleza no-garantizada de estos
#     supuestos a nivel de archivo de config.
#
# Sincronizado al 100% con los valores anteriores hardcoded.
# ─────────────────────────────────────────────────────────────────────────────

