[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-first-advisory"
version = "0.1.0"
description = "Risk-first suitability engine for financial advisors. AI proposes, advisor decides."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "risk-first-advisory contributors" }]
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "cvxpy>=1.4",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "yfinance>=0.2",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
    "mypy>=1.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

